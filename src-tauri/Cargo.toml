[package]
name = "guanmo"
version = "1.11.0"
edition = "2021"
license = "MIT"

[features]
default = []
# Release 冷启动性能埋点（JSONL 落盘）。
# 默认关闭；仅性能测试版构建启用：npm run tauri build -- --features startup-metrics
startup-metrics = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
zip = { version = "2", default-features = false }
windows-sys = { version = "0.60.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
sysinfo = "0.30"

# Tauri plugins
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-shell = "2"
async-trait = "0.1"
sha2 = "0.10"
oauth2 = "5.0.0"
tauri-plugin-single-instance = "2"
futures-util = "0.3"
http = "1"
bytes = "1"
sse-stream = "=0.2.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
rmcp = { version = "=3.7.0", default-features = false, features = ["client", "server", "transport-async-rw", "transport-streamable-http-client", "transport-streamable-http-server", "auth"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
process-wrap = { version = "=10.0.0", default-features = false, features = ["tokio1", "creation-flags", "job-object", "kill-on-drop", "process-group"] }
url = "2"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
tauri-plugin-notification = "2.3.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Data_Xml_Dom", "Foundation", "Foundation_Collections", "UI_Notifications", "Win32_Graphics_Dwm"] }
windows-registry = "0.6.1"

[lib]
name = "guanmo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
