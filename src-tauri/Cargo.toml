[package]
name = "guanmo"
version = "1.6.1"
edition = "2021"
license = "MIT"

[features]
default = []
# Release 冷启动性能埋点（JSONL 落盘）。
# 默认关闭；仅性能测试版构建启用：npm run tauri build -- --features startup-metrics
startup-metrics = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
windows-sys = { version = "0.60.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
sysinfo = "0.30"

# Tauri plugins
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "sync"] }
tokio-util = "0.7"
url = "2"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
tauri-plugin-notification = "2.3.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Data_Xml_Dom", "Foundation", "Foundation_Collections", "UI_Notifications"] }
windows-registry = "0.6.1"

[lib]
name = "guanmo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
